<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>De Legacy Barber — Admin Dashboard</title>
  <link rel="stylesheet" href="styles.css" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <style>
    .admin-section { padding: 20px 20px 100px 20px; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; margin-bottom: 24px; }
    .admin-header h2 { font-family: var(--font-primary); font-size: 38px; color: var(--blue-bright); margin: 0; }
    .admin-login-box { max-width: 400px; margin: 40px auto; text-align: center; padding: 40px; }
    .admin-login-box input { margin-bottom: 16px; }
    .admin-table-wrap { overflow-x: auto; background: var(--card-bg); border-radius: 22px; border: 1px solid var(--border); padding: 16px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { text-align: left; padding: 12px 8px; border-bottom: 2px solid var(--border); color: var(--blue-bright); font-family: var(--font-display); letter-spacing: 0.05em; }
    td { padding: 10px 8px; border-bottom: 1px solid rgba(255,255,255,0.05); color: var(--text-secondary); }
    tr:last-child td { border-bottom: none; }
    .status-badge { padding: 4px 12px; border-radius: 60px; font-size: 11px; font-weight: 700; background: rgba(74, 139, 202, 0.2); color: var(--blue-bright); }
    .pdf-btn { background: var(--destructive); border: none; padding: 12px 24px; border-radius: 60px; color: white; font-weight: 700; cursor: pointer; transition: 0.2s; }
    .pdf-btn:hover { filter: brightness(1.1); transform: scale(1.02); }
    .pdf-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .loading-msg { text-align: center; color: var(--muted); padding: 40px 0; }
    .delete-btn { background: transparent; border: 1px solid var(--destructive); color: var(--destructive); padding: 4px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; transition: 0.2s; }
    .delete-btn:hover { background: var(--destructive); color: white; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="db-config.js"></script>
</head>
<body>
  <nav class="nav container">
    <a href="index.html" class="logo-link">
      <img src="hero.jpeg" alt="De Legacy Barber Shop" class="logo-icon" />
      <div class="logo-primary">De Legacy</div>
    </a>
    <div class="nav-links">
      <a class="nav-btn ghost" href="index.html">← HOME</a>
    </div>
  </nav>

  <section class="admin-section container">
    <div id="loginScreen" class="card admin-login-box">
      <h2 style="color: var(--blue-bright); font-family: var(--font-primary); margin-bottom: 20px;">Admin Access</h2>
      <input type="password" id="adminPassword" class="text-input" placeholder="Enter Password" />
      <button id="loginBtn" class="btn-gold" style="width: 100%;">Login</button>
      <p id="loginError" class="msg-error" style="margin-top: 12px;"></p>
    </div>

    <div id="dashboard" style="display: none;">
      <div class="admin-header">
        <h2>📋 All Appointments</h2>
        <button id="exportPdfBtn" class="pdf-btn">📄 Export to PDF</button>
      </div>
      <div id="appointmentsContainer" class="admin-table-wrap">
        <div class="loading-msg">Loading appointments from cloud...</div>
      </div>
    </div>
  </section>

  <footer class="site-footer" style="margin-top: 40px;">
    <div class="container">
      <div class="footer-bottom">© 2026 De Legacy Barber. Admin Dashboard.</div>
    </div>
  </footer>

  <script>
    const ADMIN_PASSWORD = "legacy2026";

    document.getElementById("loginBtn").addEventListener("click", () => {
      const input = document.getElementById("adminPassword").value;
      if (input === ADMIN_PASSWORD) {
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("dashboard").style.display = "block";
        loadAppointments();
      } else {
        document.getElementById("loginError").textContent = "Incorrect password.";
      }
    });

    document.getElementById("adminPassword").addEventListener("keypress", (e) => {
      if (e.key === "Enter") document.getElementById("loginBtn").click();
    });

    async function loadAppointments() {
      const container = document.getElementById("appointmentsContainer");
      container.innerHTML = `<div class="loading-msg">Loading appointments...</div>`;
      try {
        const snapshot = await db.collection("bookings")
          .orderBy("date", "asc")
          .orderBy("time", "asc")
          .get();

        if (snapshot.empty) {
          container.innerHTML = `<p style="text-align:center; color: var(--muted); padding: 40px;">No bookings found yet.</p>`;
          return;
        }

        let html = `<table>
          <thead><tr>
            <th>Date</th><th>Time</th><th>Client</th><th>Cut</th><th>Type</th><th>Contact</th><th>Address</th><th>Action</th>
          </tr></thead><tbody>`;

        let count = 0;
        snapshot.forEach(doc => {
          const b = doc.data();
          const docId = doc.id;
          let dateStr = b.date;
          try {
            dateStr = new Date(b.date + "T00:00:00").toLocaleDateString(undefined, {
              weekday: "short", year: "numeric", month: "short", day: "numeric"
            });
          } catch (e) {}

          html += `<tr>
            <td><strong>${dateStr}</strong></td>
            <td>${b.time || '-'}</td>
            <td>${b.name || '-'}</td>
            <td><span class="status-badge">${b.cut || '-'}</span></td>
            <td>${b.type || '-'}</td>
            <td>${b.phone || '-'}</td>
            <td style="font-size: 12px; max-width: 150px;">${b.address || '-'}</td>
            <td><button class="delete-btn" data-docid="${docId}">🗑 Delete</button></td>
          </tr>`;
          count++;
        });

        html += `</tbody></table>`;
        html += `<p style="color: var(--muted); margin-top: 12px; font-size: 13px;">Total Appointments: <strong>${count}</strong></p>`;

        container.innerHTML = html;

        container.querySelectorAll(".delete-btn").forEach(btn => {
          btn.addEventListener("click", async () => {
            const docId = btn.getAttribute("data-docid");
            if (confirm("Are you sure you want to delete this appointment?")) {
              try {
                await db.collection("bookings").doc(docId).delete();
                loadAppointments();
              } catch (error) {
                console.error("Error deleting:", error);
                alert("Failed to delete. Check console.");
              }
            }
          });
        });

      } catch (error) {
        console.error("Error loading data:", error);
        container.innerHTML = `<p class="msg-error">Failed to load data. Check console for details.</p>`;
      }
    }

    document.getElementById("exportPdfBtn").addEventListener("click", function() {
      const btn = this;
      btn.textContent = "⏳ Generating PDF...";
      btn.disabled = true;
      const element = document.getElementById("appointmentsContainer");
      const opt = {
        margin: [10, 10, 10, 10],
        filename: `De_Legacy_Appointments_${new Date().toISOString().split('T')[0]}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true, letterRendering: true },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
      };
      html2pdf().set(opt).from(element).save().then(() => {
        btn.textContent = "📄 Export to PDF";
        btn.disabled = false;
      }).catch((err) => {
        console.error("PDF generation error:", err);
        alert("Failed to generate PDF. Try again.");
        btn.textContent = "📄 Export to PDF";
        btn.disabled = false;
      });
    });
  </script>
</body>
</html>
